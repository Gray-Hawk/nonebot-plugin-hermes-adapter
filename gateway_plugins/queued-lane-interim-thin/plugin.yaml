name: queued-lane-interim-thin
version: 0.1.0
description: "Two narrow gateway wrappers, no upstream edit: a queued-lane first response on an api_server run is published as that run's message.interim instead of a doomed adapter.send(), and a run.completed output already published as an interim on the same run stream is not repeated. Plus a Kanban guard that stops new api_server self-notification subscriptions from being created (the NB report source keeps delivering)."
