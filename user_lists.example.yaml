# 统一用户设置清单(人改,现读现用;保存即生效,无需重启)
# 落位:<hermes_custom_dir>/user_lists.yaml(把这个模板的三个名单改成真实值后放过去;
#       未配置 hermes_custom_dir 时放 localstore 插件数据目录)
# 文件缺失 / 坏档 → 全默认:黑名单空、bot 表空、唤起白名单回落管理员集合
# id 只允许数字/字母/下划线/横线;识别不了的条目自动跳过
# 注意:模板里的号码全部是占位号,部署时换成真实账号

# 黑名单:{群号: [账号id, ...]}——名单账号的消息不置 explicit/addressed(仅群聊生效;
# 私聊不受名单影响)。语义=不主动响应,消息照常入库、窗内跟帖照常可见。
blacklist:
  "20001": ["30001"]

# 已知 bot 账号表(裸 id,全局)——名单账号的发言不钉委托锚(防 bot 互相接话
# 挤占锚位/刷锚龄),仍可被正常响应。
known_bots: ["30002"]

# 私聊主动下行白名单(裸 id,全局)——允许被主动下行私聊的账号,唤起(wake_turn)
# 与直发(push_message)两通道共用同一份名单。
# 未配置本键(或整文件缺失/坏档)时,回落到管理员集合(hermes_admin_users,
# 复合键按当前适配器拆前缀取裸 id);显式配置(含空表)以显式值为准——
# 显式空表 = 不允许任何人被主动下行。
private_allow: ["10001"]
