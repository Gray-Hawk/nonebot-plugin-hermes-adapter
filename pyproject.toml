# 发布暂存区布局：本文件与 README.md、LICENSE、*.example.yaml 位于暂存区根，
# 其余源码统一收在 nonebot_plugin_agent_adapter/ 包目录下。
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-agent-adapter"
version = "0.2.0"
description = "NoneBot 插件：把聊天平台消息桥接到 Agent 后端 API（nonebot-plugin-hermes 的独立演进分支）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 运行期依赖：覆盖生产代码实际 import 的第三方包；PyYAML 用于四份 YAML 配置与规则文件。
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.50.2",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "fastmcp>=3.0,<5",
    "json5>=0.9.25",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 离线配置迁移脚本是开发文件（源码仓库 scripts/migrate_config_v6.py），不随公开 wheel
# 发行；从源码树跑它时才需要 python-dotenv。
migrate = ["python-dotenv>=1.0"]

[project.urls]
# TODO(D3)：远端仓库改名未批准，Homepage 留在旧仓库 URL；改名后与 README badge 一起切新名。
Homepage = "https://github.com/Gray-Hawk/nonebot-plugin-hermes-adapter"
Upstream = "https://github.com/gsskk/nonebot-plugin-hermes"

[tool.nonebot]
plugins = ["nonebot_plugin_agent_adapter"]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_agent_adapter*"]
# 公共发行面（2026-11-14 定案）：wheel 只保留插件运行需要的安装文件。
# tests/scripts/gateway_plugins/turn_tests/verify.py 是开发文件，留在源码仓库。
# 第一道闸在发布暂存（release_sync 不复制它们），这里是第二道闸。
exclude = [
    "nonebot_plugin_agent_adapter.tests*",
    "nonebot_plugin_agent_adapter.scripts*",
    "nonebot_plugin_agent_adapter.gateway_plugins*",
    "nonebot_plugin_agent_adapter.turn_tests*",
]

[tool.setuptools.package-data]
nonebot_plugin_agent_adapter = ["skill/*.md"]
