# 发布暂存区布局：本文件与 README.md、LICENSE、*.example.yaml 位于暂存区根，
# 其余源码统一收在 nonebot_plugin_hermes_adapter/ 包目录下。
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-hermes-adapter"
version = "0.1.0"
description = "NoneBot 插件：把聊天平台消息桥接到 Hermes Agent API Server（nonebot-plugin-hermes 的独立演进分支）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 运行期依赖：覆盖生产代码实际 import 的第三方包；PyYAML 用于四份 YAML 配置与规则文件。
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.50.2",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "fastmcp>=3.0,<5",
    "json5>=0.9.25",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 离线配置迁移脚本（包内 scripts/migrate_config_v6.py）读旧 .env 时才需要。
migrate = ["python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/Gray-Hawk/nonebot-plugin-hermes-adapter"
Upstream = "https://github.com/gsskk/nonebot-plugin-hermes"

[tool.nonebot]
plugins = ["nonebot_plugin_hermes_adapter"]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_hermes_adapter*"]

[tool.setuptools.package-data]
nonebot_plugin_hermes_adapter = ["skill/*.md"]
